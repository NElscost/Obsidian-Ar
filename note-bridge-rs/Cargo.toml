[package]
name = "obsidian-note-bridge"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", features = ["http1", "json", "tokio"] }
mime_guess = "2.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
symphonia = { version = "0.5.4", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tokio = { version = "1.48", features = ["fs", "macros", "net", "rt-multi-thread", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "cors", "trace"] }
walkdir = "2.5"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
