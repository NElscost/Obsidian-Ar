name: Release Obsidian AR plugin

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: obsidian-ar-plugin/package-lock.json
      - name: Build and test plugin
        working-directory: obsidian-ar-plugin
        run: |
          npm ci
          npm run build
          npm test
      - name: Verify community-directory files
        run: |
          cmp manifest.json obsidian-ar-plugin/manifest.json
          cmp versions.json obsidian-ar-plugin/versions.json
          cmp main.js obsidian-ar-plugin/main.js
          cmp styles.css obsidian-ar-plugin/styles.css
      - name: Package plugin
        run: |
          cd obsidian-ar-plugin
          zip ../obsidian-ar-plugin.zip main.js manifest.json styles.css
      - name: Verify tag matches manifest
        run: |
          VERSION=$(node -p "require('./obsidian-ar-plugin/manifest.json').version")
          test "$GITHUB_REF_NAME" = "$VERSION"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obsidian-ar-plugin.zip
            obsidian-ar-plugin/main.js
            obsidian-ar-plugin/manifest.json
            obsidian-ar-plugin/styles.css
